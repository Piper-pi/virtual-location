name: build

on:
  workflow_dispatch:   # 手动触发：Actions → build → Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Build (unsigned)
        run: python3 build.py --unsigned

      - name: Verify output
        run: |
          ls -l build/
          unzip -l build/virtual-location-unsigned.apk | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: virtual-location-unsigned
          path: build/virtual-location-unsigned.apk
          if-no-files-found: error

